<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display2</title>
</head>
<body style="margin: 0; padding: 0;">
    <!-- Parent -->
<!-- Flex - It is used to align childrens within a parent div container -->
    <div style="display: flex; gap: 20px;background-color: gray; padding: 8px;">
        <!-- child -->
         <div>Store</div>
         <div>Mac</div>
         <div>Iphone</div>
         <div>Watch </div>
    </div>
</body>
</html>
