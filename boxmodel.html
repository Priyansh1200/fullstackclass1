<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- content-box - It excludes padding , border, margins and applies them separately(Default) -->
     <!-- border-box - It includes padding, border, margins and applies them in the same element dimensions -->
    <div style="width: 100px;
     height: 100px;
      background-color: red;
       border: 4px solid yellowgreen;
        padding: 4px; 
        margin: 4px; 
        box-sizing: border-box;">
        
    </div>
</body>
</html>
